# Correct text in already-published Facebook / LinkedIn posts (see edit_post.py).
# Manual only - triggered with auth/dispatch.py, never on a schedule.
name: edit-published-post

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated FB post ids and/or LinkedIn share URNs (from post-log.csv)"
        type: string
        required: true
      find:
        description: "Exact text to replace"
        type: string
        required: true
      replace:
        description: "Replacement text"
        type: string
        required: true
      dry_run:
        description: "Show what would change, edit nothing"
        type: boolean
        default: true

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Edit posts
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          TARGETS: ${{ inputs.targets }}
          FIND: ${{ inputs.find }}
          REPLACE: ${{ inputs.replace }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python edit_post.py
