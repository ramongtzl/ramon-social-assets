# One-shot credential and asset check. Manual only - never scheduled, never posts.
#
# The hourly dry run proves the secrets are READABLE, but if no slot is due it
# never calls Instagram, so a wrong token or a wrong account id still looks
# like a pass. This asks Graph who each account is, and fetches the real image
# URLs the agent would hand it.
#
# It prints usernames, counts and URLs only - the token is never echoed, and a
# failure prints Graph's own error message so the cause is unambiguous.

name: verify-token

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ask Instagram who these accounts are
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_GROWTH: ${{ secrets.IG_USER_GROWTH }}
          IG_USER_HOUSES: ${{ secrets.IG_USER_HOUSES }}
          ASSET_BASE_URL: ${{ secrets.ASSET_BASE_URL }}
        run: |
          python - <<'PY'
          import os, csv, io, json, sys, urllib.request, urllib.error

          tok = os.environ.get("IG_TOKEN", "")
          base = os.environ.get("ASSET_BASE_URL", "").rstrip("/")
          # same resolution the agent does - see the comment in post_agent.py
          if base and os.path.isdir("assets") and not base.endswith("/assets"):
              base += "/assets"
          print("token present :", bool(tok), "| length", len(tok))
          print()

          def get(url):
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      return True, json.load(r)
              except urllib.error.HTTPError as e:
                  return False, e.read().decode("utf-8", "replace")[:400]
              except Exception as e:
                  return False, str(e)

          bad = 0

          # 1. token identity and expiry
          ok, d = get("https://graph.facebook.com/v21.0/debug_token"
                      "?input_token=%s&access_token=%s" % (tok, tok))
          if ok:
              dd = d.get("data", {})
              print("token valid   :", dd.get("is_valid"))
              print("expires_at    :", dd.get("expires_at"), "(0 = never)")
              print("scopes        :", ",".join(dd.get("scopes", [])))
              if not dd.get("is_valid"):
                  bad += 1
          else:
              print("TOKEN DEBUG FAILED:", d); bad += 1
          print()

          # 2. each Instagram account answers to this token
          for label, key in (("growthwealth", "IG_USER_GROWTH"),
                             ("ramonhouses",  "IG_USER_HOUSES")):
              ok, d = get("https://graph.facebook.com/v21.0/%s"
                          "?fields=username,name,media_count&access_token=%s"
                          % (os.environ.get(key, ""), tok))
              if ok:
                  print("%-12s -> @%s | %s posts"
                        % (label, d.get("username"), d.get("media_count")))
              else:
                  print("%-12s -> FAILED: %s" % (label, d)); bad += 1
          print()

          # 3. the REAL image URLs, taken from the schedule.
          #
          #    Probing something at the repo root (schedule.csv) is NOT this
          #    test: on 2026-09-06 that passed while every image 404'd, because
          #    ASSET_BASE_URL was missing the assets/ segment. Graph fetches
          #    these URLs itself, so what matters is that they return an image
          #    content-type, not merely HTTP 200 - a GitHub 404 page is a 200
          #    to nothing and an HTML body to Graph.
          rows = list(csv.DictReader(io.open("schedule.csv", encoding="utf-8-sig")))
          seen, checked = set(), 0
          for r in rows:
              for rel in r["images"].split("|"):
                  rel = rel.strip()
                  if not rel:
                      continue
                  head = rel.split("/")[0]
                  if head in seen:
                      continue          # one probe per media folder is enough
                  seen.add(head)
                  url = base + "/" + rel
                  try:
                      req = urllib.request.Request(url, method="HEAD")
                      with urllib.request.urlopen(req, timeout=30) as resp:
                          ct = resp.headers.get("Content-Type", "")
                          okct = ct.startswith(("image/", "video/"))
                          print("%-9s %s  %s" % (resp.status, ct, url))
                          if not okct:
                              print("           ^ NOT MEDIA - Graph will reject this")
                              bad += 1
                  except Exception as e:
                      print("FAILED    %s  %s" % (e, url)); bad += 1
                  checked += 1
          print("media folders probed:", checked)

          print()
          print("RESULT:", "FAIL" if bad else "PASS")
          sys.exit(1 if bad else 0)
          PY
